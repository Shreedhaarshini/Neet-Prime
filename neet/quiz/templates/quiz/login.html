{% extends 'quiz/base.html' %}
{% block title %}Log In | AI Study{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5 shadow border-0 mt-5">
            <h2 class="text-center text-primary mb-4 fw-bold">Welcome Back</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Log In</button>
                </div>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted">Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-primary text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
